name: Web

on:
  pull_request:
    paths: &web-paths
      - frontend/**
      - deploy/compose.yml
      - deploy/ckauth.caddy
      - deploy/deploy.sh
      - .github/workflows/web.yml
      - .github/workflows/deploy.yml
  push:
    branches: [main]
    paths: *web-paths
  # redeploy or roll back by hand from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag (full git sha) to deploy; empty = build this commit
        required: false

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  image:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/chiragdev1/ckauth-web:${{ github.sha }}
            ghcr.io/chiragdev1/ckauth-web:latest
          cache-from: type=gha,scope=ckauth-web
          cache-to: type=gha,mode=max,scope=ckauth-web

  deploy:
    needs: image
    # after a main build, or alone when a tag was given by hand
    if: ${{ always() && (needs.image.result == 'success' || (inputs.tag && needs.image.result == 'skipped')) }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      service: web
      tag: ${{ inputs.tag || github.sha }}
      smoke-path: /
