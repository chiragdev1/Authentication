# a separate compose project from main (which gets the folder name, "authentication"), so its own containers, network
# and volumes, on host ports that don't clash. `pnpm db:up` / `db:down` here never touch main's database or redis
name: authentication-microservices

services:
  postgresdb:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_microservices
    volumes:
      - auth_microservices_pgdata:/var/lib/postgresql/data
  # email queue and shared rate limit counts
  redis:
    image: redis:7
    ports:
      - "6380:6379"
volumes:
  auth_microservices_pgdata:
