services:
  postgresdb:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=authentication-with-typescript
    volumes:
      - postgres_data_1:/var/lib/postgresql/data
  # rate limit counts; without REDIS_URL the api counts in memory instead, which is fine for one dev process
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  postgres_data_1:
